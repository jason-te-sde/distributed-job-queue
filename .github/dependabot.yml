version: 2

updates:
  # One entry for both modules. bench replaces the root module with ../, so a
  # dependency the root raises has to move in bench/go.mod in the same change;
  # as two entries, a root update left bench failing to load until someone ran
  # go mod tidy there.
  - package-ecosystem: gomod
    directories:
      - /
      - /bench
    schedule:
      interval: monthly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Ruling 35: the chaos test uses the Toxiproxy Go client at v2.12.0.
      # From v2.13.0 on, the module declares go 1.27.0, and taking it would
      # raise the go directive of go.mod past the 1.26.0 that the 1.26.x leg
      # of CI builds with. Lift this when the module's go floor reaches 1.27.
      - dependency-name: github.com/Shopify/toxiproxy/v2
        versions: [">=2.13.0"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-helm
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
