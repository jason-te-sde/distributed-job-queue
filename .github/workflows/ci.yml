name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed of the chaos test's fault schedule and workload
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  # A manual run has the chaos seed in its group, so that dispatching seeds 1,
  # 2 and 3 back to back runs all three: in one group the second would wait
  # and the third would replace it. Every other trigger has an empty suffix.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.seed || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never download a toolchain: each job runs the Go version it asked for.
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # buf-action runs lint only. The breaking comparison is the next step,
      # which fetches the base branch itself and skips when it has no proto/.
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          lint: true
          format: false
          breaking: false
          push: false
          pr_comment: false
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          base="$(git rev-parse FETCH_HEAD)"
          if git cat-file -e "$base:proto" 2>/dev/null; then
            # The commit id is explicit on purpose: buf 1.75.0 accepts
            # ref=FETCH_HEAD but then reports nothing, even for a breaking change.
            buf breaking --against ".git#ref=$base"
          else
            echo "buf breaking: $GITHUB_BASE_REF has no proto/ directory yet, so there is nothing to compare against"
          fi
      - name: gen-check
        run: |
          make gen
          # git status, not git diff: a diff ignores generated files that were
          # never committed, and `git add -N` would stage the deletion of a
          # stale one and hide it.
          changes="$(git status --porcelain -- internal/gen)"
          if [ -n "$changes" ]; then
            echo "internal/gen is out of date; run make gen and commit the result:" >&2
            echo "$changes" >&2
            git diff --stat -- internal/gen >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-helm
      - name: Helm chart lint and render checks
        run: scripts/check-helm.sh

  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: go test -race
        run: go test -race ./...
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.os }}-go${{ matrix.go }}
          path: |
            **/*.log
            internal/sim/testdata/failures/**
          if-no-files-found: ignore

  pg:
    name: pg (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      JOBQUEUE_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: go vet
        run: go vet -tags pg ./...
      - name: go test -race
        run: go test -race -count=1 -tags pg -json ./... > pg.json
      # Also after a failed go test, which writes only JSON: this step is what
      # prints the failing tests and what they wrote. It is skipped when an
      # earlier step failed before go test started, because pg.json does not
      # exist then.
      - name: Count the pg tests
        if: ${{ always() && hashFiles('pg.json') != '' }}
        run: scripts/check-pg-count.sh pg.json
      - name: Upload the test events
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pg-events-postgres${{ matrix.postgres }}
          path: pg.json
          if-no-files-found: ignore

  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOXIPROXY_VERSION: 2.13.0
      JOBQUEUE_CHAOS_PG_CONTAINER: jq-chaos-pg
      JOBQUEUE_CHAOS_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      JOBQUEUE_CHAOS_SEED: ${{ inputs.seed || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      # The test restarts this container by name with docker restart, so it is
      # started here under a fixed name; a services: container gets a name
      # that Actions generates.
      - name: Start PostgreSQL 18
        run: |
          set -euo pipefail
          docker run -d --name jq-chaos-pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:18
          for _ in $(seq 1 60); do
            if docker exec jq-chaos-pg pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs jq-chaos-pg
          echo "PostgreSQL did not become ready" >&2
          exit 1
      # The binary is verified against the checksum that the release itself
      # publishes before anything runs it.
      - name: Start Toxiproxy ${{ env.TOXIPROXY_VERSION }}
        run: |
          set -euo pipefail
          base="https://github.com/Shopify/toxiproxy/releases/download/v${TOXIPROXY_VERSION}"
          dir="$RUNNER_TEMP/toxiproxy"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 --max-time 120 -o toxiproxy-server-linux-amd64 "$base/toxiproxy-server-linux-amd64"
          curl -fsSL --retry 3 --max-time 30 -o checksums.txt "$base/checksums.txt"
          grep ' toxiproxy-server-linux-amd64$' checksums.txt | sha256sum --check --strict -
          chmod +x toxiproxy-server-linux-amd64
          nohup ./toxiproxy-server-linux-amd64 -host 127.0.0.1 -port 8474 >"$dir/toxiproxy.log" 2>&1 &
          echo $! >"$dir/toxiproxy.pid"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8474/version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$dir/toxiproxy.log"
          echo "toxiproxy-server did not start" >&2
          exit 1
      - name: Chaos test (seed ${{ env.JOBQUEUE_CHAOS_SEED }})
        run: go test -tags chaos -count=1 -timeout 25m -v ./test/chaos/
      # Whatever the result: keep what the services said, where the upload
      # below finds it, and stop them. The container and the proxy server are
      # not left to the end of the job.
      - name: Save the service logs and stop the services
        if: always()
        run: |
          set -uo pipefail
          mkdir -p test/chaos/artifacts
          docker logs jq-chaos-pg >test/chaos/artifacts/postgres.log 2>&1 || true
          cp "$RUNNER_TEMP/toxiproxy/toxiproxy.log" test/chaos/artifacts/toxiproxy.log 2>/dev/null || true
          docker stop jq-chaos-pg >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/toxiproxy/toxiproxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/toxiproxy/toxiproxy.pid")" 2>/dev/null || true
          fi
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-failures-seed-${{ env.JOBQUEUE_CHAOS_SEED }}
          path: test/chaos/artifacts/**
          if-no-files-found: ignore

  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit messages are scanned too, so the whole history is needed.
          fetch-depth: 0
      # make test-scripts runs the Helm check's own test, which needs Helm.
      - uses: ./.github/actions/setup-helm
      - name: Hygiene check and its tests
        run: make hygiene test-scripts

  clean-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: false
      - name: Build and test a fresh clone with cold caches
        run: |
          set -euo pipefail
          # Everything lives under RUNNER_TEMP so the upload step can find it.
          clone="$RUNNER_TEMP/clean-clone"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$clone"
          GOMODCACHE="$(mktemp -d "$RUNNER_TEMP/gomodcache.XXXXXX")"
          GOCACHE="$(mktemp -d "$RUNNER_TEMP/gocache.XXXXXX")"
          export GOMODCACHE GOCACHE
          cd "$clone"
          go build ./...
          go test ./...
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clean-clone-failures
          path: |
            ${{ runner.temp }}/clean-clone/**/*.log
            ${{ runner.temp }}/clean-clone/internal/sim/testdata/failures/**
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Nothing is pushed. The build stage runs on the runner's own architecture
      # and cross-compiles, and the final stage only copies files, so building
      # arm64 needs no emulation and no setup-qemu-action. The result stays in
      # the builder's cache, which the next steps reuse.
      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
      # The arm64 binaries cannot run on this runner, so a wrong-architecture
      # build would pass everything else. Export the image and read the ELF
      # header of both binaries.
      - name: Export the linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          outputs: type=local,dest=${{ runner.temp }}/image-arm64
      - name: Assert the arm64 binaries are arm64
        run: |
          set -euo pipefail
          for bin in jobqueue-server jobqueuectl; do
            description="$(file -b "$RUNNER_TEMP/image-arm64/$bin")"
            echo "$bin: $description"
            case "$description" in
              ELF*"ARM aarch64"*) ;;
              *) echo "$bin is not an ELF arm64 binary" >&2; exit 1 ;;
            esac
          done
      # A multi-platform result cannot be loaded into the Docker daemon, so the
      # smoke test gets the amd64 image. The builder keeps the layers of the
      # builds above, so this one compiles nothing again. The amd64 binaries run
      # in the smoke test, which is their architecture check.
      - name: Build for linux/amd64 and load it
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: jq:ci
      - name: Smoke test
        run: scripts/image-smoke.sh jq:ci
