name: Set up Helm
description: >
  Installs a pinned Helm version and verifies the installed binary against the
  checksum published with the Helm release. Linux x86-64 runners only.

inputs:
  version:
    description: Helm version, with the leading v.
    default: v4.1.3

runs:
  using: composite
  steps:
    - uses: azure/setup-helm@v5
      with:
        version: ${{ inputs.version }}
    # The installer does not check what it downloads, so check it here: fetch the
    # release archive and its published checksum, verify the archive, then
    # require the installed binary to be the one inside it.
    - name: Verify Helm against the published checksum
      shell: bash
      env:
        HELM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
          echo "setup-helm: only Linux x86-64 runners are supported" >&2
          exit 1
        fi
        archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
        cd "$(mktemp -d)"
        curl -fsSLO "https://get.helm.sh/${archive}"
        curl -fsSLO "https://get.helm.sh/${archive}.sha256sum"
        sha256sum -c "${archive}.sha256sum"
        tar -xzf "$archive" linux-amd64/helm
        want="$(sha256sum linux-amd64/helm | cut -d' ' -f1)"
        got="$(sha256sum "$(command -v helm)" | cut -d' ' -f1)"
        if [ "$want" != "$got" ]; then
          echo "setup-helm: $(command -v helm) is not the verified ${HELM_VERSION} release binary" >&2
          exit 1
        fi
        helm version
