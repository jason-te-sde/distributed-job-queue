{{- if .Values.example.enabled }}
{{- /*
A broker with a tokens file requires a token from every caller, insecure or not,
and without insecure it must have one. So the worker needs a token unless the
broker has no tokens file and insecure is true.
*/}}
{{- if and (not .Values.example.tokenSecret) (or .Values.tokens.secretName (not .Values.insecure)) }}
{{- fail "example.enabled requires example.tokenSecret when tokens.secretName is set or insecure is false: a broker with a tokens file requires a token from every caller, and without insecure it must have one" }}
{{- end }}
{{- if and .Values.example.tokenSecret (not .Values.example.tokenKey) }}
{{- fail "example.tokenSecret requires example.tokenKey: name the key of the Secret that holds the token" }}
{{- end }}
{{- /*
The broker serves TLS whenever it has a certificate, and insecure only lifts its
refusal to serve without one. So the worker uses TLS whenever the TLS Secret is
set, and plaintext only without it.
*/}}
{{- $trustCA := .Values.tls.secretName }}
# A demonstration worker for the thumbnails queue. Under KEDA it starts at zero
# replicas and the ScaledObject raises it when the queue has a backlog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jobqueue.fullname" . }}-example-worker
  labels:
    {{- include "jobqueue.labels" (dict "ctx" . "component" "example-worker") | nindent 4 }}
spec:
  replicas: {{ if .Values.example.keda.enabled }}0{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "jobqueue.selectorLabels" (dict "ctx" . "component" "example-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jobqueue.labels" (dict "ctx" . "component" "example-worker") | nindent 8 }}
    spec:
      securityContext:
        {{- include "jobqueue.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "jobqueue.image" . | quote }}
          command: ["/thumbnail"]
          args:
            - "work"
            - "--addr"
            - {{ printf "dns:///%s-grpc:%s" (include "jobqueue.fullname" .) (include "jobqueue.grpcPort" .) | quote }}
            - "--concurrency"
            - {{ .Values.example.concurrency | quote }}
            {{- if $trustCA }}
            - "--tls-ca"
            - "/etc/jobqueue/tls/ca.crt"
            {{- else if .Values.insecure }}
            - "--insecure"
            {{- end }}
          env:
            {{- include "jobqueue.databaseEnv" . | nindent 12 }}
            {{- if .Values.example.tokenSecret }}
            - name: JOBQUEUE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.example.tokenSecret }}
                  key: {{ .Values.example.tokenKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "jobqueue.containerSecurityContext" . | nindent 12 }}
          {{- if $trustCA }}
          volumeMounts:
            - name: tls-ca
              mountPath: /etc/jobqueue/tls
              readOnly: true
          {{- end }}
      {{- if $trustCA }}
      # Only the CA certificate is projected: the worker has no use for the
      # broker's private key.
      volumes:
        - name: tls-ca
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
