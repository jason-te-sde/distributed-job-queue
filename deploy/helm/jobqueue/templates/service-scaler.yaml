{{- if .Values.scaler.enabled }}
# The KEDA external scaler endpoint.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jobqueue.fullname" . }}-scaler
  labels:
    {{- include "jobqueue.brokerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "jobqueue.brokerSelectorLabels" . | nindent 4 }}
  ports:
    - name: scaler
      port: {{ .Values.scaler.port }}
      targetPort: scaler
{{- end }}
