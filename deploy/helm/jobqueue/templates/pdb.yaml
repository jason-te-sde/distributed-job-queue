apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jobqueue.fullname" . }}
  labels:
    {{- include "jobqueue.brokerLabels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "jobqueue.brokerSelectorLabels" . | nindent 6 }}
