# Health, readiness and Prometheus metrics. gRPC clients use the headless
# Service instead.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jobqueue.fullname" . }}-http
  labels:
    {{- include "jobqueue.brokerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "jobqueue.brokerSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ include "jobqueue.httpPort" . }}
      targetPort: http
