# Default values for the jobqueue chart.
#
# The chart never creates Secrets. The database, tokens and TLS Secrets named
# below must exist in the release namespace before the chart is installed,
# because the migration hook runs before anything else does.

image:
  repository: ghcr.io/jason-te-sde/distributed-job-queue
  # An empty tag means the chart appVersion.
  tag: ""

# Broker replicas. Keep at least 2 so that a rolling restart or a node drain
# always leaves a broker serving.
replicas: 2

database:
  # Secret holding the PostgreSQL connection URL, passed to the broker, the
  # migration Job and the example worker as JOBQUEUE_DATABASE_URL.
  secretName: jobqueue-database
  secretKey: url

# Secret with a key named "tokens": the bearer-token file (see
# docs/operations.md for the format). Empty means no token file.
tokens:
  secretName: ""

# Secret of type kubernetes.io/tls (keys tls.crt and tls.key). Empty means the
# broker serves plaintext. When example.enabled is true the Secret also needs a
# "ca.crt" key, the CA the example worker trusts; cert-manager adds one.
tls:
  secretName: ""

# The broker refuses to serve a non-loopback address without both TLS and
# tokens. Set this to true only for a trusted network or a test cluster.
insecure: false

# Dispatch order across tenants: drr or fifo.
scheduler: drr
# Per-tenant weights for drr, for example "a=4,b=1". Empty means weight 1 each.
tenantWeights: ""

# KEDA external scaler endpoint. It carries no token authentication, because
# KEDA does not send bearer tokens, so a NetworkPolicy restricts it to the
# namespace named in allowNamespace.
scaler:
  enabled: true
  port: 7072
  allowNamespace: keda

pdb:
  minAvailable: 1

# How long the broker drains after SIGTERM, waiting for running calls before it
# cuts them off. The chart passes it to the broker as --shutdown-grace.
shutdownGraceSeconds: 25
# The preStop sleep plus shutdownGraceSeconds must be less than the termination
# grace period, or the kubelet kills the pod in the middle of the drain; the
# chart refuses to render otherwise.
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5

# Applied to the broker, the migration Job and the example worker.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# A demonstration worker that renders thumbnails (examples/thumbnail).
example:
  enabled: false
  concurrency: 4
  # The worker reaches the broker the way the broker is served. With
  # tls.secretName set it connects over TLS and trusts the "ca.crt" key of that
  # Secret, which must hold one (cert-manager adds it), and the certificate
  # must name the gRPC Service host that the worker dials. Otherwise, with
  # insecure=true, it connects in plaintext.
  #
  # tokenSecret and tokenKey name the Secret key that holds the worker's bearer
  # token, a "worker" token for the queue thumbnails (see the tokens Secret).
  # The token is passed as JOBQUEUE_TOKEN. It is required when tokens.secretName
  # is set and when insecure is false: a broker with a tokens file requires a
  # token from every caller, and without insecure it must have one.
  tokenSecret: ""
  tokenKey: ""
  # Scale the example worker on the queue backlog through KEDA. Requires KEDA
  # to be installed in the cluster, example.enabled and scaler.enabled.
  keda:
    enabled: false
    minReplicas: 0
    maxReplicas: 5
    targetBacklog: 10
    pollingInterval: 5
    cooldownPeriod: 30

# Run "jobqueuectl migrate" as a pre-install and pre-upgrade hook.
migrations:
  enabled: true
  # The limit for the whole migrate command, as a Go duration such as 90s or 10m;
  # the chart passes it as --timeout. Without one jobqueuectl gives up after 10
  # seconds, which a migration that builds an index on a large table does not
  # meet. Helm waits for a hook for at most its own --timeout, which is 5m unless
  # you set it, so raise "helm install --timeout" and "helm upgrade --timeout" to
  # at least this value as well (plus the time to pull the image) when you raise
  # it.
  timeout: 10m
