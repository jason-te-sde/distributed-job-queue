# PostgreSQL for the end-to-end tests (test/e2e): one pod, no persistence. The
# data lives in an emptyDir, so it is gone with the pod, which is what a test
# database should do. The credentials are the test cluster's own and guard
# nothing. The jobqueue-database Secret that the chart reads points at the
# Service below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  # Recreate, never a rolling update: two pods must not share one database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=postgres", "--dbname=postgres"]
            periodSeconds: 2
            failureThreshold: 30
          # The image of PostgreSQL 18 keeps its data in a versioned directory
          # below /var/lib/postgresql, which is the path its volume is declared
          # at, so the emptyDir goes there and not at .../data.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
